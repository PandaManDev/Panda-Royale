name: Build and publish Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Export Panda Royale for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        run: godot --version

      - name: Import project assets
        run: godot --headless --editor --path . --quit

      - name: Parse critical GDScript files
        run: |
          # Standalone script mode does not register project autoload globals such as NetworkManager.
          # Check this standalone script directly; the main-scene smoke test below parses game.gd
          # with project autoloads registered and fails the job on compile errors.
          godot --headless --path . --check-only --script res://scripts/network_manager.gd

      - name: Smoke-test the main scene
        run: godot --headless --path . --quit-after 10

      - name: Export Windows executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/PandaRoyale.exe

      - name: Ensure executable was created
        run: test -s build/PandaRoyale.exe

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaRoyale-Windows-${{ github.ref_name }}
          path: build/PandaRoyale.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release and attach EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}
          name: Panda Royale ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.sha) }}
          generate_release_notes: true
          files: build/PandaRoyale.exe

  build-launcher:
    name: Package Panda Royale Launcher
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows game executable
        uses: actions/download-artifact@v4
        with:
          name: PandaRoyale-Windows-${{ github.ref_name }}
          path: package

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate launcher Python syntax
        run: python -m py_compile launcher/launcher.py

      - name: Build launcher executable
        run: |
          python -m pip install --upgrade pip pyinstaller pypresence
          python -m PyInstaller --onedir --noconsole launcher/launcher.py --name PandaRoyaleLauncher

      - name: Assemble launcher package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PandaRoyale | Out-Null
          Copy-Item package/PandaRoyale.exe dist/PandaRoyale/PandaRoyale.exe
          Copy-Item dist/PandaRoyaleLauncher/* dist/PandaRoyale/ -Recurse -Force
          Set-Content -Path dist/PandaRoyale/README.txt -Value "Run PandaRoyaleLauncher.exe to open the Panda Royale launcher. Keep the _internal folder and PandaRoyale.exe beside the launcher executable."
          Compress-Archive -Path dist/PandaRoyale/* -DestinationPath dist/PandaRoyale-Windows-Launcher.zip -Force

      - name: Upload launcher package
        uses: actions/upload-artifact@v4
        with:
          name: PandaRoyale-Windows-Launcher-${{ github.ref_name }}
          path: dist/PandaRoyale-Windows-Launcher.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach launcher package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}
          name: Panda Royale ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.sha) }}
          files: dist/PandaRoyale-Windows-Launcher.zip
